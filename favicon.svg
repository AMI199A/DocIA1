<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de fondo ultra profundo -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Gradiente Esmeralda de alta intensidad -->
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Resplandor vibrante -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo del contenedor -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Silueta estilizada de Documento -->
  <path d="M18 14 h18 l14 14 v22 a4 4 0 0 1 -4 4 H18 a4 4 0 0 1 -4 -4 V18 a4 4 0 0 1 4 -4 z" 
        fill="#09090b" stroke="#f4f4f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Esquina plegada -->
  <path d="M36 14 v14 h14" fill="none" stroke="#f4f4f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Destello IA Esmeralda llamativo con Glow -->
  <g filter="url(#glow)">
    <path d="M30 26 c0 4.4 3.6 8 8 8 c-4.4 0-8 3.6-8 8 c0-4.4-3.6-8-8-8 c4.4 0 8-3.6 8-8 z" fill="url(#emeraldNeon)" />
    <circle cx="44" cy="24" r="3" fill="#34d399"/>
  </g>
</svg>
