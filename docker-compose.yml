services:
  # Aplicación DocIA (Backend FastAPI + Frontend integrado)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docia-app
    ports:
      - "8000:8000"
    environment:
      # Conecta directamente al Ollama que ya tienes instalado y corriendo en Windows
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=phi3
      - STORAGE_PATH=/app/archivos_generados
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docia.db:/app/docia.db
      - ./archivos_generados:/app/archivos_generados
    restart: unless-stopped
