services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docia-app
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Define GEMINI_API_KEY en el archivo .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      STORAGE_PATH: /app/archivos_generados
    volumes:
      - ./docia.db:/app/docia.db
      - ./archivos_generados:/app/archivos_generados
      - ./archivos_rag:/app/archivos_rag
    restart: unless-stopped
